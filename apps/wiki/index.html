<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiki</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wiki">
<meta name="theme-color" content="#161310">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Spline+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #161310;
    --surface: #211c16;
    --surface-2: #2a241c;
    --line: #352c20;
    --text: #efe7d8;
    --muted: #a9977c;
    --dim: #6f6149;
    --accent: #d9a441;     /* warm bronze */
    --accent-soft: #d9a4411c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Spline Sans', sans-serif;
    min-height: 100vh;
    padding: max(18px, env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom));
    background-image: radial-gradient(120% 60% at 50% -8%, #2a2014 0%, transparent 58%);
    background-attachment: fixed;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  header h1 { font-family: 'Spectral', serif; font-weight: 600; font-size: 26px; color: var(--accent); letter-spacing: .01em; }
  .back-link, .crumb { color: var(--muted); text-decoration: none; font-size: 14px; cursor: pointer; background: none; border: none; font-family: inherit; }
  .back-link:hover, .crumb:hover { color: var(--accent); }
  .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); margin: 4px 0 18px; }

  /* search */
  .search {
    width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
    color: var(--text); font-family: 'Spline Sans', sans-serif; font-size: 16px; padding: 12px 14px;
    outline: none; margin-bottom: 18px; transition: border-color .15s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--dim); }

  /* note list */
  .note-row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 9px; transition: border-color .15s, transform .1s;
    font-family: inherit;
  }
  .note-row:hover { border-color: var(--accent); }
  .note-row:active { transform: scale(.99); }
  .note-row .nt { font-family: 'Spectral', serif; font-size: 18px; color: var(--text); }
  .note-row .np { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wiki-section { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
    margin: 22px 0 9px; padding: 0 0 5px; border-bottom: 1px solid var(--line); }
  .wiki-section:first-child { margin-top: 0; }
  .wiki-section:hover { color: var(--accent); }
  .wiki-section .chev { display: inline-flex; transition: transform .18s; }
  .wiki-section.collapsed .chev { transform: rotate(-90deg); }
  .wiki-section .sec-count { margin-left: auto; color: var(--dim); }
  .wiki-group.collapsed { display: none; }
  /* internal note links */
  .doc a.wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); cursor: pointer; }
  .doc a.wikilink:hover { background: var(--accent-soft); }
  .doc .wikilink.broken { color: var(--dim); border-bottom: 1px dotted var(--dim); cursor: default; }

  .empty { text-align: center; color: var(--dim); font-family: 'Spectral', serif; font-style: italic; font-size: 18px; padding: 50px 20px; line-height: 1.6; }
  .empty code { font-family: 'JetBrains Mono', monospace; font-style: normal; color: var(--muted); font-size: 13px; }

  /* reader */
  #readerView { display: none; }
  .reader-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .raw-link { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim); text-decoration: none; }
  .raw-link:hover { color: var(--accent); }
  .doc { font-family: 'Spectral', serif; font-size: 18px; line-height: 1.65; color: var(--text); }
  .doc h1, .doc h2, .doc h3, .doc h4 { font-weight: 600; line-height: 1.3; margin: 1.4em 0 .5em; color: #f6efe0; }
  .doc h1 { font-size: 28px; color: var(--accent); }
  .doc h2 { font-size: 23px; }
  .doc h3 { font-size: 20px; }
  .doc h1:first-child, .doc h2:first-child { margin-top: 0; }
  .doc p { margin: .8em 0; }
  .doc ul, .doc ol { margin: .7em 0 .7em 1.4em; }
  .doc li { margin: .3em 0; }
  .doc a { color: var(--accent); }
  .doc code { font-family: 'JetBrains Mono', monospace; font-size: .85em; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
  .doc pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; margin: 1em 0; }
  .doc pre code { background: none; padding: 0; font-size: 13px; line-height: 1.5; }
  .doc blockquote { border-left: 3px solid var(--accent); padding-left: 14px; margin: 1em 0; color: var(--muted); font-style: italic; }
  .doc hr { border: none; border-top: 1px solid var(--line); margin: 1.6em 0; }
  .doc img { max-width: 100%; border-radius: 8px; }
  .loading { color: var(--dim); font-style: italic; padding: 30px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wiki</h1>
    <a class="back-link" href="../../store/index.html">← Store</a>
  </header>

  <!-- LIST -->
  <div id="listView">
    <div class="count" id="count">loading…</div>
    <input id="search" class="search" type="search" placeholder="Filter notes…" autocomplete="off">
    <div id="list"></div>
  </div>

  <!-- READER -->
  <div id="readerView">
    <div class="reader-bar">
      <button class="crumb" id="backBtn">← All notes</button>
      <a class="raw-link" id="rawLink" target="_blank" rel="noopener">view raw</a>
    </div>
    <div class="doc" id="doc"></div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const NOTES_BASE = '../../notes/';
  let index = [];
  const byPath = {}, byBase = {};
  const attrEsc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
  const CHEV = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function buildLinkMaps() {
    for (const k in byPath) delete byPath[k]; for (const k in byBase) delete byBase[k];
    index.forEach(n => { const pl = n.path.toLowerCase(); byPath[pl] = n; byPath[pl.replace(/\.(md|markdown|txt)$/, '')] = n; const base = fileOf(n.path).replace(/\.[^.]+$/, '').toLowerCase(); if (!(base in byBase)) byBase[base] = n; });
  }
  // resolve an Obsidian [[link]] or a relative .md link target to an index note
  function resolveNote(target) {
    let t = String(target).split('#')[0].split('|')[0].trim(); if (!t) return null;
    t = t.replace(/^\.?\//, ''); const tl = t.toLowerCase();
    if (byPath[tl]) return byPath[tl];
    const base = tl.slice(tl.lastIndexOf('/') + 1).replace(/\.(md|markdown|txt)$/, '');
    return byBase[base] || null;
  }

  /* ── tiny markdown renderer (no libraries) ── */
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(t) {
    return t
      .replace(/`([^`]+)`/g, (m, c) => '<code>' + c + '</code>')
      .replace(/\[\[([^\]]+)\]\]/g, (m, inner) => wikiLink(inner))
      .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2">')
      .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, text, url) => mdLink(text, url))
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/(^|\s)_([^_]+)_/g, '$1<em>$2</em>');
  }
  function wikiLink(inner) {
    const parts = inner.split('|'); const disp = (parts[1] || parts[0].split('#')[0]).trim() || parts[0];
    const n = resolveNote(parts[0]);
    return n ? `<a class="wikilink" data-note="${attrEsc(n.path)}">${disp}</a>` : `<span class="wikilink broken">${disp}</span>`;
  }
  function mdLink(text, url) {
    if (/^(https?:|mailto:|#)/i.test(url)) return `<a href="${url}" target="_blank" rel="noopener">${text}</a>`;
    const n = resolveNote(url);
    return n ? `<a class="wikilink" data-note="${attrEsc(n.path)}">${text}</a>` : `<a href="${url}" target="_blank" rel="noopener">${text}</a>`;
  }
  function mdToHtml(src) {
    src = src.replace(/\r\n?/g, '\n');
    const blocks = [];
    src = src.replace(/```[^\n]*\n([\s\S]*?)```/g, (m, code) => {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, '')) + '</code></pre>');
      return '␀' + (blocks.length - 1) + '␀';
    });
    src = esc(src);
    const L = src.split('\n'); let html = '', i = 0;
    const isPH = s => /^␀\d+␀$/.test(s.trim());
    while (i < L.length) {
      let line = L[i];
      if (isPH(line)) { html += blocks[+line.trim().slice(1, -1)]; i++; continue; }
      if (/^\s*$/.test(line)) { i++; continue; }
      let h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { const n = h[1].length; html += `<h${n}>` + inline(h[2].trim()) + `</h${n}>`; i++; continue; }
      if (/^\s*([-*_])\1\1+\s*$/.test(line)) { html += '<hr>'; i++; continue; }
      if (/^\s*&gt;\s?/.test(line)) { let b = []; while (i < L.length && /^\s*&gt;\s?/.test(L[i])) { b.push(L[i].replace(/^\s*&gt;\s?/, '')); i++; } html += '<blockquote>' + inline(b.join(' ')) + '</blockquote>'; continue; }
      if (/^\s*[-*+]\s+/.test(line)) { let b = []; while (i < L.length && /^\s*[-*+]\s+/.test(L[i])) { b.push('<li>' + inline(L[i].replace(/^\s*[-*+]\s+/, '')) + '</li>'); i++; } html += '<ul>' + b.join('') + '</ul>'; continue; }
      if (/^\s*\d+\.\s+/.test(line)) { let b = []; while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) { b.push('<li>' + inline(L[i].replace(/^\s*\d+\.\s+/, '')) + '</li>'); i++; } html += '<ol>' + b.join('') + '</ol>'; continue; }
      let b = [];
      while (i < L.length && !/^\s*$/.test(L[i]) && !isPH(L[i]) && !/^#{1,6}\s/.test(L[i]) && !/^\s*&gt;/.test(L[i]) && !/^\s*[-*+]\s+/.test(L[i]) && !/^\s*\d+\.\s+/.test(L[i])) { b.push(L[i]); i++; }
      html += '<p>' + inline(b.join(' ')) + '</p>';
    }
    return html;
  }

  /* ── list (grouped by folder) ── */
  const folderOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };
  const fileOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); };
  const COLLAPSE_KEY = 'wiki.v1.collapsed';
  let collapsed = (() => { try { return new Set(JSON.parse(localStorage.getItem(COLLAPSE_KEY)) || []); } catch (e) { return new Set(); } })();
  const saveCollapsed = () => { try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify([...collapsed])); } catch (e) {} };
  function renderList(filter) {
    const box = $('list');
    const q = (filter || '').trim().toLowerCase();
    const items = q ? index.filter(n => (n.title + ' ' + n.path).toLowerCase().includes(q)) : index;
    if (!index.length) {
      box.innerHTML = '<div class="empty">No notes synced yet.<br>Run <code>tools/sync-notes.ps1</code> once the junction is set up.</div>';
      return;
    }
    if (!items.length) { box.innerHTML = '<div class="empty">No notes match that filter.</div>'; return; }
    // bucket by folder, root group first then alphabetical
    const groups = {};
    items.forEach(n => { const f = folderOf(n.path); (groups[f] || (groups[f] = [])).push(n); });
    const folders = Object.keys(groups).sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));
    box.innerHTML = '';
    folders.forEach(f => {
      const isCol = !q && collapsed.has(f);   // a filter shows everything expanded
      const head = document.createElement('button');
      head.className = 'wiki-section' + (isCol ? ' collapsed' : '');
      head.innerHTML = `<span class="chev">${CHEV}</span><span>${f === '' ? 'Top level' : esc(f)}</span><span class="sec-count">${groups[f].length}</span>`;
      box.appendChild(head);
      const grp = document.createElement('div');
      grp.className = 'wiki-group' + (isCol ? ' collapsed' : '');
      groups[f].forEach(n => {
        const row = document.createElement('button');
        row.className = 'note-row';
        const t = document.createElement('div'); t.className = 'nt'; t.textContent = n.title || n.path;
        const p = document.createElement('div'); p.className = 'np'; p.textContent = fileOf(n.path);
        row.appendChild(t); row.appendChild(p);
        row.addEventListener('click', () => openNote(n, 'list'));
        grp.appendChild(row);
      });
      box.appendChild(grp);
      head.addEventListener('click', () => {
        const nowCol = !grp.classList.contains('collapsed');
        grp.classList.toggle('collapsed', nowCol); head.classList.toggle('collapsed', nowCol);
        if (!q) { nowCol ? collapsed.add(f) : collapsed.delete(f); saveCollapsed(); }
      });
    });
  }

  /* ── reader ── */
  let navStack = [], currentNote = null;
  async function openNote(n, mode) {
    if (mode === 'list') navStack = [];
    else if (mode === 'link' && currentNote) navStack.push(currentNote);
    currentNote = n;
    $('listView').style.display = 'none';
    $('readerView').style.display = 'block';
    $('backBtn').textContent = navStack.length ? '← Back' : '← All notes';
    $('doc').innerHTML = '<div class="loading">opening…</div>';
    const url = NOTES_BASE + n.path.split('/').map(encodeURIComponent).join('/');
    $('rawLink').href = url;
    window.scrollTo(0, 0);
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const md = await res.text();
      $('doc').innerHTML = mdToHtml(md);
      // wire internal note links
      $('doc').querySelectorAll('a.wikilink[data-note]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = index.find(x => x.path === a.dataset.note); if (t) openNote(t, 'link'); }));
    } catch (e) {
      $('doc').innerHTML = '<div class="empty">Could not load this note.<br>It may need a sync, or you may be offline.</div>';
    }
  }
  function showList() {
    $('readerView').style.display = 'none';
    $('listView').style.display = 'block';
  }
  $('backBtn').addEventListener('click', () => { if (navStack.length) openNote(navStack.pop(), 'back'); else { currentNote = null; showList(); } });
  $('search').addEventListener('input', e => renderList(e.target.value));

  /* ── load index ── */
  fetch('notes-index.json', { cache: 'no-cache' })
    .then(r => r.ok ? r.json() : [])
    .then(data => {
      index = Array.isArray(data) ? data : [];
      index.sort((a, b) => (a.path || '').localeCompare(b.path || ''));
      buildLinkMaps();
      $('count').textContent = index.length + (index.length === 1 ? ' note' : ' notes');
      renderList('');
    })
    .catch(() => { index = []; $('count').textContent = '0 notes'; renderList(''); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
